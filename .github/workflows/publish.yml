name: publish

# Build the image and push it to GHCR as ghcr.io/<owner>/trilium-mcp-proxy (built-in GITHUB_TOKEN).
#
#   push to main -> :main            (a testable image; latest is NOT moved)
#   v* tag push  -> :1.2.3/:1.2/:1 + :latest, a GitHub release and a notefeed post
#
# A v* tag must equal pyproject.toml's version.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Image: \`ghcr.io/marceltov/trilium-mcp-proxy:${TAG#v}\`. Setup: see the README."
          gh release view "$TAG" >/dev/null 2>&1 && gh release edit "$TAG" --title "$TAG" --notes "$notes" \
            || gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag

      # Posts the release notes to the notefeed feed for the Trilium projects. Skipped
      # without the secrets (forks); a re-run doesn't post twice, the tag <repo>-vX.Y.Z
      # on the note is what the check looks for.
      - name: Post the notes to notefeed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTEFEED_URL: https://notefeed.me
          NOTEFEED_FEED: ${{ secrets.NOTEFEED_FEED }}
          NOTEFEED_FEED_PASSWORD: ${{ secrets.NOTEFEED_FEED_PASSWORD }}
        run: |
          [ -n "$NOTEFEED_FEED" ] || { echo "No NOTEFEED_FEED secret, not posting"; exit 0; }
          repo=${GITHUB_REPOSITORY#*/}
          feed="$NOTEFEED_URL/api/v1/feeds/$NOTEFEED_FEED/notes"
          posted=$(curl -fsS -H "X-Feed-Password: $NOTEFEED_FEED_PASSWORD" "$feed?tag=$repo-$TAG&limit=1" | jq '.notes | length')
          [ "$posted" = 0 ] || { echo "$repo $TAG is already on notefeed"; exit 0; }
          gh release view "$TAG" --json body,url --jq '.body + "\n\n[The release on GitHub](" + .url + ")\n"' > notefeed.md
          curl -fsS -o /dev/null -H "Content-Type: text/markdown" -H "X-Feed-Password: $NOTEFEED_FEED_PASSWORD" \
            -H "X-Note-Title: $repo ${TAG#v}" -H "X-Note-Tags: release,$repo,$repo-$TAG" \
            --data-binary @notefeed.md "$feed"
