[project]
name = "trilium-mcp-proxy"
version = "0.1.1"
description = "OAuth front for Trilium Notes' built-in MCP server, for clients that can't send a token header"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "mcp-login-oauth @ git+https://github.com/Marceltov/mcp-login-oauth@v0.1.1",
    "httpx>=0.28",
    "uvicorn>=0.30",
]

[project.scripts]
trilium-mcp-proxy = "trilium_mcp_proxy.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trilium_mcp_proxy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
